name: Release

on:
  push:
    branches: [main]
    paths:
      - RobotVirtualSubnetDebugger/RobotVirtualSubnetDebugger.csproj
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish release artifacts
        shell: pwsh
        run: ./scripts/publish-release.ps1 -SkipSign

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RobotNet.Windows.Wpf-release
          path: artifacts/release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content -Raw RobotVirtualSubnetDebugger/RobotVirtualSubnetDebugger.csproj)
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version" }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
              throw "Tag does not match package version $tag"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "$tag is already released."
              exit 0
          }
          $files = Get-ChildItem artifacts/release -File | Where-Object Extension -in '.zip', '.exe', '.sha256'
          $paths = @($files.FullName)
          gh release create $tag @paths --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $tag --generate-notes
          exit $LASTEXITCODE
